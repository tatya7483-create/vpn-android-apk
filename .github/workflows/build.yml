name: Build Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'arena/**'
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        id: build
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle assembleDebug --no-daemon --console=plain > /tmp/g.log 2>&1
          EXIT=$?
          echo "Gradle exit: $EXIT"
          if [ $EXIT -ne 0 ]; then
            ERR_FILE=/tmp/errors.txt
            echo "## Kotlin/Gradle Build Errors" > $ERR_FILE
            echo "" >> $ERR_FILE
            echo '```' >> $ERR_FILE
            grep -iE "^e:|^error:|FAILED|BUILD FAILED|FAILURE:|What went wrong|Caused by|Could not|Unresolved|Execution failed|exception|^>" /tmp/g.log | head -30 >> $ERR_FILE
            echo '```' >> $ERR_FILE
            echo "" >> $ERR_FILE
            echo "## Last 80 lines" >> $ERR_FILE
            echo "" >> $ERR_FILE
            echo '```' >> $ERR_FILE
            tail -80 /tmp/g.log >> $ERR_FILE
            echo '```' >> $ERR_FILE
            cat $ERR_FILE
            # Create issue with errors
            TITLE="Build error on $(date +%Y-%m-%d)"
            gh issue create --title "$TITLE" --body-file $ERR_FILE  2>&1 || echo "Could not create issue"
            exit $EXIT
          fi
          echo "=== SUCCESS ==="
          find app/build -name "*.apk" -type f
          ls -la app/build/outputs/apk/debug/

      - name: Prepare dist
        if: success()
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/VpnShare.apk
          ls -la dist/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: dist/VpnShare.apk

  build-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download wintun.dll
        run: |
          set -e
          mkdir -p pc/core/res
          WINTUN_VER="0.14.1"
          WINTUN_DLL=""
          for url in "https://www.wintun.net/builds/wintun-${WINTUN_VER}.zip"; do
            if curl -fsSL "$url" -o /tmp/wintun.zip --max-time 60; then
              rm -rf /tmp/wintun/ && mkdir -p /tmp/wintun/
              if unzip -o /tmp/wintun.zip -d /tmp/wintun/ 2>/dev/null; then
                CANDIDATE=$(find /tmp/wintun -name "wintun.dll" -path "*amd64*" | head -1)
                [ -z "$CANDIDATE" ] && CANDIDATE=$(find /tmp/wintun -name "wintun.dll" | head -1)
                if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ] && [ $(stat -c%s "$CANDIDATE") -gt 10000 ]; then
                  WINTUN_DLL="$CANDIDATE"; break
                fi
              fi
            fi
          done
          [ -z "$WINTUN_DLL" ] && echo "ERROR: wintun.dll download failed" && exit 1
          cp "$WINTUN_DLL" pc/core/res/wintun.dll

      - name: Get Go dependencies
        working-directory: pc
        run: go mod tidy && go mod download

      - name: Go vet (Windows target)
        working-directory: pc
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build Windows GUI binary
        working-directory: pc
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -H windowsgui" -o ../dist/VpnShare.exe .

      - name: Build Windows console binary
        working-directory: pc
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w" -o ../dist/VpnShare-console.exe .

      - name: Copy wintun.dll to dist
        run: mkdir -p dist && cp pc/core/res/wintun.dll dist/wintun.dll

      - uses: actions/upload-artifact@v4
        with:
          name: pc-windows
          path: |
            dist/VpnShare.exe
            dist/VpnShare-console.exe
            dist/wintun.dll

  release:
    needs: [build-android, build-pc]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release
        run: |
          mkdir -p release
          cp artifacts/android-apk/VpnShare.apk release/
          cp artifacts/pc-windows/VpnShare.exe release/
          cp artifacts/pc-windows/VpnShare-console.exe release/
          cp artifacts/pc-windows/wintun.dll release/
          cp README.md release/
          cd release && zip -r ../VpnShare-v${GITHUB_REF#refs/tags/v}.zip .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/VpnShare.apk
            release/VpnShare.exe
            release/VpnShare-console.exe
            release/wintun.dll
            VpnShare-v*.zip
