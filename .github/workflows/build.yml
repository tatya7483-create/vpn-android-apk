name: Build Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'arena/**'
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept Android licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Gradle
        working-directory: android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/
          sudo ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon
          echo "APK built:"
          find app/build -name "*.apk" -type f

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/VpnShare.apk
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/VpnShare.apk

  build-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download wintun.dll
        run: |
          set -e
          mkdir -p pc/core/res
          WINTUN_VER="0.14.1"
          echo "Downloading wintun.dll v${WINTUN_VER}..."
          WINTUN_DLL=""
          for url in \
            "https://www.wintun.net/builds/wintun-${WINTUN_VER}.zip" \
            "https://codeload.github.com/WireGuard/wintun/zip/refs/tags/v${WINTUN_VER}"; do
            echo "Trying $url ..."
            if curl -fsSL "$url" -o /tmp/wintun.zip --max-time 60; then
              rm -rf /tmp/wintun/
              mkdir -p /tmp/wintun/
              if unzip -o /tmp/wintun.zip -d /tmp/wintun/ 2>/dev/null; then
                CANDIDATE=$(find /tmp/wintun -name "wintun.dll" -path "*amd64*" | head -1)
                if [ -z "$CANDIDATE" ]; then
                  CANDIDATE=$(find /tmp/wintun -name "wintun.dll" | head -1)
                fi
                if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ] && [ $(stat -c%s "$CANDIDATE" 2>/dev/null || echo 0) -gt 10000 ]; then
                  WINTUN_DLL="$CANDIDATE"
                  echo "Found wintun.dll at $CANDIDATE ($(stat -c%s "$CANDIDATE") bytes)"
                  break
                fi
              fi
            fi
          done
          if [ -z "$WINTUN_DLL" ]; then
            echo "ERROR: Could not download wintun.dll"
            exit 1
          fi
          cp "$WINTUN_DLL" pc/core/res/wintun.dll
          echo "wintun.dll: $(ls -la pc/core/res/wintun.dll)"

      - name: Get Go dependencies
        working-directory: pc
        run: |
          go mod tidy
          go mod download

      - name: Go vet (Windows target)
        working-directory: pc
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build Windows GUI binary
        working-directory: pc
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "-s -w -H windowsgui" \
            -o ../dist/VpnShare.exe .
          ls -la ../dist/VpnShare.exe

      - name: Build Windows console binary
        working-directory: pc
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "-s -w" \
            -o ../dist/VpnShare-console.exe .

      - name: Copy wintun.dll to dist
        run: |
          mkdir -p dist
          cp pc/core/res/wintun.dll dist/wintun.dll
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pc-windows
          path: |
            dist/VpnShare.exe
            dist/VpnShare-console.exe
            dist/wintun.dll

  release:
    needs: [build-android, build-pc]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Package release
        run: |
          mkdir -p release
          cp artifacts/android-apk/VpnShare.apk release/
          cp artifacts/pc-windows/VpnShare.exe release/
          cp artifacts/pc-windows/VpnShare-console.exe release/
          cp artifacts/pc-windows/wintun.dll release/
          cp README.md release/
          ls -la release/
          cd release && zip -r ../VpnShare-v${GITHUB_REF#refs/tags/v}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/VpnShare.apk
            release/VpnShare.exe
            release/VpnShare-console.exe
            release/wintun.dll
            VpnShare-v*.zip
          draft: false
          prerelease: false
          body: |
            ## VPN Share — совместное использование VPN через USB

            ### Установка
            1. Установите **VpnShare.apk** на телефон
            2. Включите USB-модем, подключите кабель
            3. Запустите VPN Share на телефоне, нажмите «Запустить»
            4. Скопируйте **VpnShare.exe** и **wintun.dll** в одну папку на ПК
            5. Запустите **VpnShare.exe** (для полного туннеля от имени администратора)
